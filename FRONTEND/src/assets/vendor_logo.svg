<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100">
  <!-- Background (transparent) -->
  <rect width="500" height="100" fill="transparent"/>
  
  <!-- Original Cart Icon -->
  <g transform="translate(50, 15) scale(0.7)">
    <circle cx="25" cy="90" r="10" fill="#6366f1"/>
    <circle cx="75" cy="90" r="10" fill="#6366f1"/>
    <path d="M10 30 L20 30 L35 70 L80 70 L95 30 L35 30" stroke="#4f46e5" stroke-width="6" fill="none"/>
    <path d="M35 30 L40 60 L80 60" stroke="#4f46e5" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Main Logo Text -->
  <g transform="translate(140, 50)">
    <text font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#4f46e5" dominant-baseline="middle">LocalCart</text>
  </g>
  
  <!-- Vendor Badge (Positioned at top-right of LocalCart text) -->
  <g transform="translate(320, 25)">
    <rect x="0" y="0" width="70" height="20" rx="10" fill="#4f46e5"/>
    <text x="35" y="10" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="central">VENDOR</text>
  </g>
  
  <!-- Tagline -->
  <g transform="translate(140, 75)">
    <text font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Farm to door, simplified</text>
  </g>
</svg>