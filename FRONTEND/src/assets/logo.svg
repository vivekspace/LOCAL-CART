<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100">
  <!-- Background (optional, transparent) -->
  <rect width="500" height="100" fill="transparent"/>
  
  <!-- Define the gradient -->
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" /> <!-- green-500 -->
      <stop offset="100%" stop-color="#059669" /> <!-- green-600 -->
    </linearGradient>
  </defs>
  
  <!-- Cart Icon -->
  <g transform="translate(50, 15) scale(0.7)">
    <circle cx="25" cy="90" r="10" fill="url(#greenGradient)"/>
    <circle cx="75" cy="90" r="10" fill="url(#greenGradient)"/>
    <path d="M10 30 L20 30 L35 70 L80 70 L95 30 L35 30" stroke="url(#greenGradient)" stroke-width="6" fill="none"/>
    <path d="M35 30 L40 60 L80 60" stroke="url(#greenGradient)" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Text "LocalCart" -->
  <g transform="translate(140, 50)">
    <text font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="url(#greenGradient)" dominant-baseline="middle">LocalCart</text>
  </g>
  
  <!-- Tagline -->
  <g transform="translate(140, 75)">
    <text font-family="Arial, sans-serif" font-size="14" fill="#555555">Farm to door, simplified</text>
  </g>
</svg>