<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background (transparent) -->
  <rect width="500" height="100" fill="transparent"/>
  
  <!-- Original Cart Icon -->
  <g transform="translate(50, 15) scale(0.7)">
    <circle cx="25" cy="90" r="10" fill="url(#blueGradient)"/>
    <circle cx="75" cy="90" r="10" fill="url(#blueGradient)"/>
    <path d="M10 30 L20 30 L35 70 L80 70 L95 30 L35 30" stroke="url(#blueGradient)" stroke-width="6" fill="none"/>
    <path d="M35 30 L40 60 L80 60" stroke="url(#blueGradient)" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Main Logo Text -->
  <g transform="translate(140, 50)">
    <text font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="url(#blueGradient)" dominant-baseline="middle">LocalCart</text>
  </g>
  
  <!-- Admin Badge (Positioned at top-right of LocalCart text) -->
  <g transform="translate(320, 25)">
    <rect x="0" y="0" width="70" height="20" rx="10" fill="url(#blueGradient)"/>
    <text x="35" y="10" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="central">ADMIN</text>
  </g>
  
  <!-- Tagline -->
  <g transform="translate(140, 75)">
    <text font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Farm to door, simplified</text>
  </g>
</svg>